name: Advertising integration checks
on:
  pull_request:
    paths:
      - 'spaza-site/dist/**'
      - 'tests/**'
      - '.github/workflows/advertising-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check spaza-site/dist/app.js
      - run: node --check spaza-site/dist/advertising.js
      - run: node --check spaza-site/dist/forus-ads.js
      - run: node --test tests/advertising.test.cjs
